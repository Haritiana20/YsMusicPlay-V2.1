
name: Build Ys Music Play V2.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project ZIP
        run: |
          unzip -q YsMusicPlay_V2_1_Android.zip -d extracted
          echo "Extracted project:"
          find extracted -maxdepth 4 -type f | head -80

      - name: Locate Android project
        run: |
          PROJECT_DIR=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YsMusicPlay-V2.1-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
